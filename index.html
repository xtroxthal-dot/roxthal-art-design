    function renderStations() {
      const list = $('radioStationsList');
      if (!list || stationsCache.length === 0) return;

      const q = ($('radioSearch')?.value || '').toLowerCase().trim();
      const filtered = stationsCache.filter(s => 
        (s.name || '').toLowerCase().includes(q) || (s.country || '').toLowerCase().includes(q)
      );

      if (filtered.length === 0) {
        list.innerHTML = `<div class="empty-state">No hay emisoras con ese nombre.</div>`;
        return;
      }

      list.innerHTML = filtered.map((s, idx) => `
        <div class="radio-station" id="station_row_${idx}">
          <div class="station-logo">
            ${s.favicon ? `<img src="${esc(s.favicon)}" style="width:100%;height:100%;object-fit:cover;border-radius:8px;" onerror="this.parentNode.innerHTML='📻'">` : '📻'}
          </div>
          <div class="station-info">
            <div class="station-name">${esc(s.name.trim())}</div>
            <div class="station-tags">📍 ${esc(s.country || 'Internacional')} • ${esc(s.bitrate || '128')} kbps</div>
          </div>
          <button class="btn btn-gold" style="padding: 10px 16px;" onclick="playStation(${idx})">▶️ Escuchar</button>
        </div>
      `).join('');
    }

    function playStation(idx) {
      const s = stationsCache[idx];
      if (!s) return;

      const streamUrl = s.url_resolved || s.url;
      const player = $('radioPlayer');

      document.querySelectorAll('.radio-station').forEach(el => el.classList.remove('playing'));
      $(`station_row_${idx}`)?.classList.add('playing');

      showStatus('radioStatus', `🔴 EN VIVO: Escuchando "${s.name.trim()}"`, 'ok');
      player.src = streamUrl;
      player.style.display = 'block';
      player.play().catch(() => {
        showStatus('radioStatus', `⚠️ El stream de "${s.name.trim()}" requiere abrirse en otra pestaña o falló. Probá con la siguiente emisora.`, 'err');
      });
    }
