/* =========================================================

const $ = id => document.getElementById(id);

function go(id){

  const el = $(id);

  if(!el) return;

  el.scrollIntoView({
    behavior:'smooth',
    block:'start'
  });
}


function status(id,msg,type=''){

  const el = $(id);

  if(!el) return;

  el.textContent = msg;

  el.className = 'status show ' + type;
}


function esc(value=''){

  return String(value).replace(
    /[&<>'"]/g,
    char => ({
      '&':'&amp;',
      '<':'&lt;',
      '>':'&gt;',
      "'":'&#39;',
      '"':'&quot;'
    }[char])
  );
}


function cat(value){

  return ({
    obras:'Obras',
    tatuajes:'Tatuajes',
    dibujos:'Dibujos',
    pinturas:'Pinturas',
    otros:'Otros'
  })[value] || value || 'Otros';
}


function formatMoney(value){

  const number = Number(value || 0);

  return '$' + number.toLocaleString(
    'es-AR',
    {
      minimumFractionDigits:2,
      maximumFractionDigits:2
    }
  );
}


function createUniqueFileName(file,category){

  let extension =
    (file.name.split('.').pop() || '')
    .toLowerCase()
    .replace(/[^a-z0-9]/g,'');

  if(!extension){

    if(file.type === 'image/jpeg')
      extension = 'jpg';

    else if(file.type === 'image/png')
      extension = 'png';

    else if(file.type === 'image/webp')
      extension = 'webp';

    else
      extension = 'jpg';
  }

  const random =
    Math.random()
    .toString(36)
    .substring(2,10);

  return (
    category +
    '/' +
    Date.now() +
    '-' +
    random +
    '.' +
    extension
  );
}

/* =========================================================
   PREVISUALIZACIÓN DE IMAGEN
   ========================================================= */

function setupImagePreview(){

  const input = $('imageFile');

  if(!input) return;

  input.addEventListener(
    'change',
    event => {

      const file =
        event.target.files?.[0];

      const preview =
        $('imagePreview');

      if(!preview)
        return;

      if(!file){

        preview.style.display='none';

        preview.src='';

        return;
      }

      if(!file.type.startsWith('image/')){

        status(
          'uploadStatus',
          '❌ Selecciona una imagen válida.',
          'err'
        );

        input.value='';

        preview.style.display='none';

        return;
      }

      if(file.size > 15 * 1024 * 1024){

        status(
          'uploadStatus',
          '❌ La imagen supera los 15 MB.',
          'err'
        );

        input.value='';

        preview.style.display='none';

        return;
      }

      const reader =
        new FileReader();

      reader.onload = () => {

        preview.src =
          reader.result;

        preview.style.display =
          'block';
      };

      reader.readAsDataURL(file);
    }
  );
}


/* =========================================================
   SUBIR NUEVA IMAGEN
   ========================================================= */

async function uploadImage(){

  try{

    if(!sb)
      throw new Error(
        'Supabase no está conectado.'
      );

    const {
      data:{session}
    } =
      await sb.auth.getSession();

    if(!session)
      throw new Error(
        'Debes iniciar sesión como administrador.'
      );

    const input =
      $('imageFile');

    const file =
      input?.files?.[0];

    if(!file)
      throw new Error(
        'Selecciona una imagen desde el teléfono.'
      );

    if(!file.type.startsWith('image/'))
      throw new Error(
        'El archivo seleccionado no es una imagen.'
      );

    if(file.size > 15 * 1024 * 1024)
      throw new Error(
        'La imagen supera los 15 MB.'
      );

    const title =
      $('imageTitle')?.value.trim() ||
      file.name.replace(
        /\.[^.]+$/,
        ''
      );

    const category =
      $('imageCategory')?.value ||
      'otros';

    const description =
      $('imageDescription')?.value.trim() ||
      '';

    status(
      'uploadStatus',
      '⏳ Subiendo imagen...'
    );

    const path =
      createUniqueFileName(
        file,
        category
      );

    const {
      data:uploadData,
      error:uploadError
    } =
      await sb
        .storage
        .from(BUCKET)
        .upload(
          path,
          file,
          {
            cacheControl:'3600',
            upsert:false,
            contentType:file.type
          }
        );

    if(uploadError)
      throw new Error(
        'Error al subir la imagen: ' +
        uploadError.message
      );

    if(!uploadData?.path)
      throw new Error(
        'Supabase no devolvió la ruta del archivo.'
      );

    const {
      data:publicData
    } =
      sb
        .storage
        .from(BUCKET)
        .getPublicUrl(path);

    const publicUrl =
      publicData?.publicUrl;

    if(!publicUrl){

      await sb
        .storage
        .from(BUCKET)
        .remove([path]);

      throw new Error(
        'No se pudo obtener la URL pública.'
      );
    }

    status(
      'uploadStatus',
      '⏳ Guardando información...'
    );

    const {
      data:record,
      error:databaseError
    } =
      await sb
        .from('images')
        .insert({
          title:title,
          category:category,
          url:publicUrl,
          description:description,
          visible:true
        })
        .select()
        .single();

    if(databaseError){

      await sb
        .storage
        .from(BUCKET)
        .remove([path]);

      throw new Error(
        'No se pudo guardar la imagen en la tabla images: ' +
        databaseError.message
      );
    }

    console.log(
      'Imagen creada:',
      record
    );

    status(
      'uploadStatus',
      '✅ Imagen subida correctamente.',
      'ok'
    );

    resetForm();

    await loadImages();

    await loadPublic();

  }catch(error){

    console.error(
      'UPLOAD ERROR:',
      error
    );

    status(
      'uploadStatus',
      '❌ ' +
      (
        error?.message ||
        'No se pudo subir la imagen.'
      ),
      'err'
    );
  }
}

/* =========================================================
   CAMBIAR FOTO EXISTENTE
   ========================================================= */

async function replaceImage(id){

  const image =
    images.find(
      item =>
        String(item.id) === String(id)
    );

  if(!image)
    return;

  const input =
    document.createElement('input');

  input.type='file';

  input.accept='image/*';

  input.style.display='none';

  document.body.appendChild(input);

  input.addEventListener(
    'change',
    async () => {

      const file =
        input.files?.[0];

      if(!file){

        input.remove();

        return;
      }

      try{

        if(!file.type.startsWith('image/'))
          throw new Error(
            'Selecciona una imagen válida.'
          );

        if(file.size > 15 * 1024 * 1024)
          throw new Error(
            'La imagen supera los 15 MB.'
          );

        status(
          'uploadStatus',
          '⏳ Cambiando fotografía...'
        );

        const category =
          image.category ||
          'otros';

        const newPath =
          createUniqueFileName(
            file,
            category
          );

        const {
          data:uploadData,
          error:uploadError
        } =
          await sb
            .storage
            .from(BUCKET)
            .upload(
              newPath,
              file,
              {
                cacheControl:'3600',
                upsert:false,
                contentType:file.type
              }
            );

        if(uploadError)
          throw uploadError;

        if(!uploadData?.path)
          throw new Error(
            'No se pudo guardar el nuevo archivo.'
          );

        const {
          data:publicData
        } =
          sb
            .storage
            .from(BUCKET)
            .getPublicUrl(
              newPath
            );

        const newUrl =
          publicData?.publicUrl;

        if(!newUrl)
          throw new Error(
            'No se pudo obtener la URL nueva.'
          );

        const {
          error:updateError
        } =
          await sb
            .from('images')
            .update({
              url:newUrl,
              updated_at:
                new Date().toISOString()
            })
            .eq(
              'id',
              image.id
            );

        if(updateError){

          await sb
            .storage
            .from(BUCKET)
            .remove([
              newPath
            ]);

          throw updateError;
        }

        /* BORRAR FOTO ANTERIOR */

        const oldPath =
          extractStoragePath(
            image.url
          );

        if(oldPath){

          await sb
            .storage
            .from(BUCKET)
            .remove([
              oldPath
            ]);
        }

        status(
          'uploadStatus',
          '✅ Fotografía cambiada correctamente.',
          'ok'
        );

        await loadImages();

        await loadPublic();

      }catch(error){

        console.error(error);

        status(
          'uploadStatus',
          '❌ ' +
          (
            error?.message ||
            'No se pudo cambiar la foto.'
          ),
          'err'
        );

      }finally{

        input.remove();
      }
    }
  );

  input.click();
}


/* =========================================================
   OBTENER RUTA STORAGE
   ========================================================= */

function extractStoragePath(url){

  if(!url)
    return null;

  try{

    const marker =
      '/storage/v1/object/public/' +
      BUCKET +
      '/';

    const index =
      url.indexOf(marker);

    if(index === -1)
      return null;

    return decodeURIComponent(
      url.substring(
        index + marker.length
      )
    );

  }catch(error){

    console.error(error);

    return null;
  }
}

/* =========================================================
   ELIMINAR IMAGEN
   ========================================================= */

async function deleteImage(id){

  const image =
    images.find(
      item =>
        String(item.id) === String(id)
    );

  if(!image)
    return;

  const confirmed =
    confirm(
      '¿Eliminar definitivamente esta imagen?'
    );

  if(!confirmed)
    return;

  try{

    status(
      'uploadStatus',
      '⏳ Eliminando imagen...'
    );

    const {
      error
    } =
      await sb
        .from('images')
        .delete()
        .eq(
          'id',
          id
        );

    if(error)
      throw error;

    const path =
      extractStoragePath(
        image.url
      );

    if(path){

      await sb
        .storage
        .from(BUCKET)
        .remove([
          path
        ]);
    }

    status(
      'uploadStatus',
      '✅ Imagen eliminada.',
      'ok'
    );

    await loadImages();

    await loadPublic();

  }catch(error){

    console.error(error);

    status(
      'uploadStatus',
      '❌ ' + error.message,
      'err'
    );
  }
}

/* =========================================================
   VISOR DE IMÁGENES

function openImageViewerEncoded(
  encodedUrl,
  encodedTitle
){

  const url =
    decodeURIComponent(
      encodedUrl
    );

  const title =
    decodeURIComponent(
      encodedTitle
    );

  openImageViewer(
    url,
    title
  );
}


function openImageViewer(
  url,
  title=''
){

  const viewer =
    $('imageViewer');

  const image =
    $('imageViewerImg');

  const titleBox =
    $('imageViewerTitle');

  if(!viewer || !image)
    return;

  image.src =
    url;

  image.alt =
    title || 'Imagen';

  if(titleBox)
    titleBox.textContent =
      title || '';

  viewer.classList.add('open');

  document.body.style.overflow =
    'hidden';
}


function closeImageViewer(event){

  if(
    event &&
    event.target &&
    event.target.id !==
      'imageViewer'
  ){
    return;
  }

  const viewer =
    $('imageViewer');

  if(!viewer)
    return;

  viewer.classList.remove('open');

  document.body.style.overflow =
    '';

  if($('imageViewerImg'))
    $('imageViewerImg').src='';
}


document.addEventListener(
  'keydown',
  event => {

    if(
      event.key === 'Escape'
    ){
      closeImageViewer();
    }
  }
);

async function loadStudents(){

  if(!sb)
    return;

  const box =
    $('studentManager');

  if(box){

    box.innerHTML = `
      <div class="empty">
        ⏳ Cargando alumnos...
      </div>
    `;
  }

  try{

    const {
      data,
      error
    } =
      await sb
        .from('students')
        .select('*')
        .order(
          'created_at',
          {
            ascending:false
          }
        );

    if(error)
      throw error;

    students =
      Array.isArray(data)
      ? data
      : [];

    renderStudents();

  }catch(error){

    console.error(error);

    status(
      'studentStatus',
      '❌ No se pudieron cargar los alumnos: ' +
      error.message,
      'err'
    );
  }
}


function renderPaymentSummary(){

  const total =
    students.length;

  const paid =
    students.filter(
      student =>
        student.payment_status ===
        'pagado'
    ).length;

  const pending =
    total - paid;

  const amount =
    students.reduce(
      (sum,student) =>
        sum +
        (
          student.payment_status ===
          'pagado'
          ? Number(
              student.payment_amount || 0
            )
          : 0
        ),
      0
    );

  if($('totalStudents'))
    $('totalStudents').textContent =
      total;

  if($('paidStudents'))
    $('paidStudents').textContent =
      paid;

  if($('pendingStudents'))
    $('pendingStudents').textContent =
      pending;

  if($('totalPaidAmount'))
    $('totalPaidAmount').textContent =
      formatMoney(amount);
}

          (student.email || '') +
          ' ' +
          (student.phone || '') +
          ' ' +
          (student.course || '')

      const searchOk =
        text.includes(search);

      const paymentOk =
        filter === 'todos' ||
        (

      return searchOk &&
        paymentOk;

  box.innerHTML =

          ${

          }
        </span>

        <div class="student-info">

          <div>
            <strong>📚 Curso</strong><br>
            ${esc(
              student.course ||

            )}
          </div>

          <div>
            <strong>📱 Teléfono</strong><br>

              student.phone ||

          </div>

              student.email ||
              'Sin email'
            )}
          </div>

        </div>

        <div class="payment-box">

          <h4>
            💳 Control de pago
          </h4>

            <div>
              <strong>Estado</strong><br>

                payment === 'pagado'

async function saveStudent(){

  try{

    const name =
      $('studentName')?.value.trim();

    if(!name)
      throw new Error(
        'El nombre del alumno es obligatorio.'
      );

    const record = {

      name:name,

      email:
        $('studentEmail')?.value.trim() || '',

      phone:
        $('studentPhone')?.value.trim() || '',

      course:
        $('studentCourse')?.value || '',

      status:
        $('studentStatusSelect')?.value ||
        'activo',

      payment_status:
        $('studentPaymentStatus')?.value ||
        'pendiente',

      payment_amount:
        Number(
          $('studentPaymentAmount')?.value ||
          0
        ),

      payment_date:
        $('studentPaymentDate')?.value ||
        null,

      notes:
        $('studentNotes')?.value.trim() ||
        ''
    };

    let result;

    if(editingStudentId){

      result =
        await sb
          .from('students')
          .update(record)
          .eq(
            'id',
            editingStudentId
          );

    }else{

      result =
        await sb
          .from('students')
          .insert(record);
    }

    if(result.error)
      throw result.error;

    status(
      'studentStatus',
      editingStudentId
      ? '✅ Alumno actualizado.'
      : '✅ Alumno añadido.',
      'ok'
    );

    resetStudentForm();

    await loadStudents();

  }catch(error){

    console.error(error);

    status(
      'studentStatus',
      '❌ ' + error.message,
      'err'
    );
  }
}


function editStudent(id){

  const student =
    students.find(
      item =>
        String(item.id) ===
        String(id)
    );

  if(!student)
    return;

  editingStudentId =
    student.id;

  if($('studentName'))
    $('studentName').value =
      student.name || '';

  if($('studentEmail'))
    $('studentEmail').value =
      student.email || '';

  if($('studentPhone'))
    $('studentPhone').value =
      student.phone || '';

  if($('studentCourse'))
    $('studentCourse').value =
      student.course || '';

  if($('studentStatusSelect'))
    $('studentStatusSelect').value =
      student.status || 'activo';

  if($('studentPaymentStatus'))
    $('studentPaymentStatus').value =
      student.payment_status ||
      'pendiente';

  if($('studentPaymentAmount'))
    $('studentPaymentAmount').value =
      student.payment_amount || '';

  if($('studentPaymentDate'))
    $('studentPaymentDate').value =
      student.payment_date || '';

  if($('studentNotes'))
    $('studentNotes').value =
      student.notes || '';

  if($('studentSaveButton'))
    $('studentSaveButton').textContent =
      '💾 Guardar cambios';

  $('studentName')?.focus();
}


function resetStudentForm(){

  editingStudentId = null;

  if($('studentName'))
    $('studentName').value='';

  if($('studentEmail'))
    $('studentEmail').value='';

  if($('studentPhone'))
    $('studentPhone').value='';

  if($('studentCourse'))
    $('studentCourse').value='';

  if($('studentStatusSelect'))
    $('studentStatusSelect').value='activo';

  if($('studentPaymentStatus'))
    $('studentPaymentStatus').value='pendiente';

  if($('studentPaymentAmount'))
    $('studentPaymentAmount').value='';

  if($('studentPaymentDate'))
    $('studentPaymentDate').value='';

  if($('studentNotes'))
    $('studentNotes').value='';

  if($('studentSaveButton'))

}


async function changeStudentStatus(
  id,
  newStatus
){

  try{

    const {
      error
    } =
      await sb
        .from('students')
        .update({
          status:newStatus
        })
        .eq(
          'id',
          id
        );

    if(error)
      throw error;

    await loadStudents();

  }catch(error){

    alert(
      'Error: ' +
      error.message
    );
  }
}


async function changeStudentPayment(
  id,
  newStatus
){

  try{

    const update = {
      payment_status:
        newStatus
    };

    if(newStatus === 'pagado'){

      update.payment_date =
        new Date()
        .toISOString()
        .slice(0,10);
    }

    const {
      error
    } =
      await sb
        .from('students')
        .update(update)
        .eq(
          'id',
          id
        );

    if(error)
      throw error;

    await loadStudents();

    status(
      'studentStatus',
      newStatus === 'pagado'
      ? '✅ Pago marcado como pagado.'
      : '🔴 Pago marcado como pendiente.',
      newStatus === 'pagado'
      ? 'ok'
      : 'err'
    );

  }catch(error){

    alert(
      'Error: ' +
      error.message
    );
  }
}


async function deleteStudent(id){

  const student =
    students.find(
      item =>
        String(item.id) ===
        String(id)
    );

  if(!student)
    return;

  if(
    !confirm(
      '¿Eliminar al alumno "' +
      student.name +
      '"?'
    )
  )
    return;

  try{

    const {
      error
    } =
      await sb
        .from('students')
        .delete()
        .eq(
          'id',
          id
        );

    if(error)
      throw error;

    await loadStudents();

    status(
      'studentStatus',
      '✅ Alumno eliminado.',
      'ok'
    );

  }catch(error){

    alert(
      'Error: ' +
      error.message
    );
  }
}

const RADIO_APIS = [
  'https://de1.api.radio-browser.info',
  'https://nl1.api.radio-browser.info',
  'https://at1.api.radio-browser.info'
];

let radioApiIndex = 0;

let radioStations = [];


async function radioFetch(path){

  let lastError = null;

  for(
    let i=0;
    i<RADIO_APIS.length;
    i++
  ){

    const base =
      RADIO_APIS[
        (
          radioApiIndex + i
        ) %
        RADIO_APIS.length
      ];

    try{

      const response =
        await fetch(
          base + path,
          {
            headers:{
              Accept:
                'application/json'
            }
          }
        );

      if(!response.ok)
        throw new Error(
          'HTTP ' +
          response.status
        );

      radioApiIndex =
        RADIO_APIS.indexOf(base);

      return await response.json();

    }catch(error){

      lastError = error;
    }
  }

  throw (
    lastError ||
    new Error(
      'No se pudo conectar con la radio.'
    )
  );
}


async function loadRadioStations(
  genre
){

  const box =
    $('radioStations');

  const radioStatus =
    $('radioStatus');

  if(!box)
    return;

  box.innerHTML = `
    <div class="empty">
      📡 Buscando emisoras...
    </div>
  `;

  if(radioStatus){

    radioStatus.className =
      'radio-status';

    radioStatus.textContent =
      'Buscando emisoras...';
  }

  try{

    const path =
      '/json/stations/bytag/' +
      encodeURIComponent(genre) +
      '?limit=50&hidebroken=true&order=clickcount&reverse=true';

    const data =
      await radioFetch(path);

    radioStations =
      (
        Array.isArray(data)
        ? data
        : []
      )
      .filter(
        station =>
          station.url_resolved ||
          station.url
      )
      .slice(
        0,
        50
      );

    renderRadioStations();

    if(radioStatus){

      radioStatus.className =
        radioStations.length
        ? 'radio-status ok'
        : 'radio-status';

      radioStatus.textContent =
        radioStations.length
        ? '🎵 ' +
          radioStations.length +
          ' emisoras disponibles.'
        : 'No se encontraron emisoras.';
    }

  }catch(error){

    console.error(error);

    box.innerHTML = `
      <div class="empty">
        ❌ No se pudieron cargar las emisoras.
      </div>
    `;

    if(radioStatus){

      radioStatus.className =
        'radio-status err';

      radioStatus.textContent =
        'No se pudo conectar con el servicio de radio.';
    }
  }
}


function renderRadioStations(){

  const box =
    $('radioStations');

  if(!box)
    return;

  const search =
    (
      $('radioSearch')?.value ||
      ''
    )
    .toLowerCase()
    .trim();

  const list =
    radioStations.filter(
      station => {

        const text =
          (
            (station.name || '') +
            ' ' +
            (station.country || '') +
            ' ' +
            (station.tags || '')
          )
          .toLowerCase();

        return text.includes(search);
      }
    );

  if(!list.length){

    box.innerHTML = `
      <div class="empty">
        No hay emisoras que coincidan.
      </div>
    `;

    return;
  }

  box.innerHTML =
    list.map(
      (station,index) => {

        const logo =
          station.favicon || '';

        return `
        <div
          class="radio-station"
          data-radio-index="${index}">

          ${
            logo
            ? `
              <img
                class="station-logo"
                src="${esc(logo)}"
                alt=""
                loading="lazy"
                onerror="this.style.display='none';">
            `
            : `
              <div
                class="station-logo"
                style="
                  display:grid;
                  place-items:center;
                  font-size:25px;">
                📻
              </div>
            `
          }

          <div class="station-info">

            <div class="station-name">
              ${esc(
                station.name ||
                'Emisora'
              )}
            </div>

            <div class="station-country">
              ${esc(
                station.country ||
                'Internacional'
              )}
            </div>

            <div class="station-tags">
              ${esc(
                station.tags ||
                ''
              )}
            </div>

          </div>

          <button
            class="btn btn-gold"
            onclick="playRadioStation(${index})">
            ▶️ Escuchar
          </button>

        </div>
        `;
      }
    ).join('');
}


async function playRadioStation(index){

  const search =
    (
      $('radioSearch')?.value ||
      ''
    )
    .toLowerCase()
    .trim();

  const list =
    radioStations.filter(
      station => {

        const text =
          (
            (station.name || '') +
            ' ' +
            (station.country || '') +
            ' ' +
            (station.tags || '')
          )
          .toLowerCase();

        return text.includes(search);
      }
    );

  const station =
    list[index];

  if(!station)
    return;

  const stream =
    station.url_resolved ||
    station.url;

  if(!stream){

    alert(
      'Esta emisora no tiene un stream disponible.'
    );

    return;
  }

  const player =
    $('radioPlayer');

  if(!player)
    return;

  try{

    player.pause();

    player.src =
      stream;

    player.style.display =
      'block';

    await player.play();

    document
      .querySelectorAll(
        '.radio-station'
      )
      .forEach(
        element =>
          element.classList.remove(
            'radio-playing'
          )
      );

    document
      .querySelector(
        `[data-radio-index="${index}"]`
      )
      ?.classList.add(
        'radio-playing'
      );

    if($('radioStatus')){

      $('radioStatus').className =
        'radio-status ok';

      $('radioStatus').textContent =
        '🔴 Escuchando: ' +
        (
          station.name ||
          'Radio'
        );
    }

  }catch(error){

    console.error(error);

    if($('radioStatus')){

      $('radioStatus').className =
        'radio-status err';

      $('radioStatus').textContent =
        '⚠️ Esta emisora no permite reproducción directa. Prueba otra.';
    }
  }
}
