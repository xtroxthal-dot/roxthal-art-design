<style>
:root{
  --bg:#080809;
  --panel:#141418;
  --gold:#d7b45a;
  --gold2:#f2da91;
  --text:#f5f5f5;
  --muted:#a8a8ad;
  --line:#303038;
}

*{box-sizing:border-box}

html{scroll-behavior:smooth}

body{
  margin:0;
  background:
    radial-gradient(circle at top,#25252b 0,#080809 50%);
  color:var(--text);
  font-family:Arial,Helvetica,sans-serif;
  line-height:1.5;
}

a{color:var(--gold2)}

button{
  font:inherit;
  cursor:pointer;
}

.top{
  position:sticky;
  top:0;
  z-index:20;
  background:rgba(7,7,8,.95);
  border-bottom:1px solid var(--line);
}

.nav{
  max-width:1200px;
  margin:auto;
  padding:12px 16px;
  display:flex;
  align-items:center;
  gap:8px;
  flex-wrap:wrap;
}

.brand{
  font-weight:800;
  color:var(--gold);
  font-size:21px;
  margin-right:auto;
}

.nav button{
  border:1px solid #45454c;
  background:#1a1a1f;
  color:#fff;
  border-radius:9px;
  padding:9px 12px;
}

.nav button:hover{
  background:var(--gold);
  color:#111;
}

section{
  max-width:1200px;
  margin:auto;
  padding:60px 18px;
}

.hero{
  max-width:none;
  min-height:78vh;
  display:grid;
  place-items:center;
  text-align:center;
  padding:70px 18px;
  background:
    linear-gradient(
      180deg,
      rgba(0,0,0,.25),
      rgba(0,0,0,.9)
    ),
    url("https://images.unsplash.com/photo-1513364776144-60967b0f800f?auto=format&fit=crop&w=1800&q=85")
    center/cover;
}

.hero-box{max-width:900px}

.eyebrow{
  letter-spacing:3px;
  text-transform:uppercase;
  color:var(--gold2);
  font-size:12px;
}

.hero h1{
  font-size:clamp(42px,8vw,82px);
  margin:12px 0;
}

.hero p{
  font-size:clamp(17px,3vw,23px);
}

.gold{color:var(--gold)}

.cta{
  display:flex;
  justify-content:center;
  gap:10px;
  flex-wrap:wrap;
  margin-top:25px;
}

.btn{
  border:0;
  border-radius:10px;
  padding:12px 18px;
  font-weight:700;
}

.btn-gold{
  background:var(--gold);
  color:#111;
}

.btn-dark{
  background:#18181d;
  color:#fff;
  border:1px solid #555;
  text-decoration:none;
}

.grid{
  display:grid;
  grid-template-columns:
    repeat(auto-fit,minmax(240px,1fr));
  gap:18px;
}

.card{
  background:
    linear-gradient(145deg,#1d1d23,#101014);
  border:1px solid var(--line);
  border-radius:16px;
  overflow:hidden;
}

.card-img{
  height:220px;
  background-size:cover;
  background-position:center;
}

.card-body{padding:20px}

.card h3{
  margin:0 0 8px;
  color:var(--gold2);
}

.muted{color:var(--muted)}

.about{
  display:grid;
  grid-template-columns:1.15fr .85fr;
  gap:28px;
  align-items:center;
}

.about-img{
  min-height:380px;
  border-radius:18px;
  background:
    url("https://images.unsplash.com/photo-1577083288073-40892c0860a4?auto=format&fit=crop&w=1000&q=85")
    center/cover;
}

.quote{
  border-left:4px solid var(--gold);
  padding:10px 18px;
  color:#ddd;
}

.contact{
  display:grid;
  grid-template-columns:
    repeat(auto-fit,minmax(220px,1fr));
  gap:15px;
}

.contact .card{padding:22px}

.admin-wrap{
  max-width:1200px;
  margin:auto;
  padding:40px 18px;
}

.login{
  max-width:430px;
  margin:30px auto;
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:16px;
  padding:25px;
}

.login h2,
.admin-wrap h2{
  color:var(--gold);
}

input,
select,
textarea{
  width:100%;
  background:#0d0d10;
  color:#fff;
  border:1px solid #45454f;
  border-radius:9px;
  padding:11px;
  margin:6px 0 13px;
}

textarea{
  min-height:95px;
  resize:vertical;
}

label{
  display:block;
  color:#ccc;
  margin-top:5px;
}

.stats{
  display:grid;
  grid-template-columns:
    repeat(auto-fit,minmax(160px,1fr));
  gap:14px;
  margin:20px 0;
}

.stat{
  background:#17171c;
  border:1px solid var(--line);
  border-radius:14px;
  padding:18px;
}

.stat b{
  display:block;
  color:var(--gold2);
  font-size:28px;
}

.stat-label{color:#bbb}

.admin-panel{
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:16px;
  padding:22px;
}

.admin-nav{
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  margin:18px 0;
}

.admin-nav button{
  border:1px solid #45454c;
  background:#1a1a1f;
  color:#fff;
  border-radius:9px;
  padding:9px 12px;
}

.admin-nav button.active{
  background:var(--gold);
  color:#111;
}

.admin-section{display:none}

.admin-section.active{display:block}

.toolbar{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
  margin:14px 0;
}

.toolbar input{
  flex:1;
  min-width:220px;
  margin:0;
}

.table-wrap{overflow:auto}

table{
  width:100%;
  min-width:900px;
  border-collapse:collapse;
}

th,td{
  padding:10px;
  border:1px solid #36363e;
  text-align:left;
}

th{
  background:#24242b;
  color:var(--gold2);
}

td{background:#121216}

.badge{
  display:inline-block;
  border-radius:20px;
  padding:4px 9px;
  font-size:12px;
  background:#333;
}

.badge.ok{background:#174d34}

.badge.bad{background:#5b2222}

.badge.pending{background:#66511c}

.actions{
  display:flex;
  gap:6px;
  flex-wrap:wrap;
}

.small{
  padding:7px 9px;
  border-radius:7px;
  border:1px solid #555;
  background:#292930;
  color:#fff;
}

.danger{
  background:#6a2525 !important;
}

.list{
  display:grid;
  gap:9px;
}

.list-item{
  padding:12px;
  border:1px solid #333;
  border-radius:10px;
  background:#111116;
}

.empty{
  padding:25px;
  text-align:center;
  color:#888;
}

.notice{
  padding:12px;
  border-radius:10px;
  background:#3b2d15;
  border:1px solid #665524;
  color:#f4df9d;
  margin:10px 0;
}

.footer{
  text-align:center;
  border-top:1px solid var(--line);
  padding:30px 18px;
  color:#999;
}

.modal{
  display:none;
  position:fixed;
  inset:0;
  z-index:50;
  background:rgba(0,0,0,.84);
  padding:18px;
  overflow:auto;
}

.modal-box{
  max-width:680px;
  margin:45px auto;
  background:#18181d;
  border:1px solid #444;
  border-radius:16px;
  padding:22px;
}

.modal-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
}

@media(max-width:750px){

  }

  .hero{
    min-height:70vh;
  }

  .admin-wrap{
    padding:25px 10px;
  }
