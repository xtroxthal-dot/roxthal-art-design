function showLoggedIn() {

  $('loginPanel')
    .classList
    .add('hidden');


  $('adminPanel')
    .classList
    .remove('hidden');


  showStatus(
    'systemHealthBox',
    '✅ Sesión de Administrador activa. Todos los permisos habilitados.',
    'ok'
  );


  loadAdminGallery();

  loadStudents();

  renderAdminSlots();

}


async function logout() {

  await sb.auth.signOut();


  $('adminPanel')
    .classList
    .add('hidden');


  $('loginPanel')
    .classList
    .remove('hidden');


  $('loginPassword').value =
    '';


  showStatus(
    'loginStatus',
    'Sesión cerrada correctamente.',
    'info'
  );

}


/* ============================================================
   NAVEGACIÓN ADMIN
   ============================================================ */

function switchAdminTab(
  tabId,
  btnEl
) {

  document
    .querySelectorAll(
      '.admin-section'
    )
    .forEach(
      el =>
        el.classList.remove(
          'active'
        )
    );


  document
    .querySelectorAll(
      '.admin-nav button'
    )
    .forEach(
      el =>
        el.classList.remove(
          'active'
        )
    );


  $(`tab-${tabId}`)
    ?.classList
    .add('active');


  if (btnEl) {

    btnEl.classList
      .add('active');

  }

}
